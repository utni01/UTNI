<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="naver-site-verification" content="880ee3c1840fa51cceff67d5bb6d1bef6056698d" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTNI - BACK SOON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            animation: fadeIn 1s ease-in-out;
        }
        .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: #ffffff;
        }
        p {
            font-size: 18px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .eng-text {
            font-size: 15px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .divider {
            width: 40px;
            height: 3px;
            background-color: #38bdf8;
            margin: 0 auto 32px;
            border-radius: 2px;
        }
        .contact-info {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
        }
        .contact-info-eng {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
            margin-bottom: 12px;
        }
        .contact-info a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            h1 { font-size: 36px; }
            p { font-size: 16px; }
            .eng-text { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">WEBSITE UNDER CONSTRUCTION</div>
        <h1>BACK SOON</h1>
        <div class="divider"></div>
        
        <p>현재 홈페이지 리뉴얼 작업이 진행 중입니다.<br>더 나은 서비스로 조만간 찾아뵙겠습니다.</p>
        <p class="eng-text">Our website is currently undergoing a renewal.<br>We will be back soon with improved services.</p>
        
        <div class="contact-info">
            문의사항이 있으신 경우 메일로 연락 주시기 바랍니다.<br>
            <div class="contact-info-eng">If you have any inquiries, please contact us via email.</div>
            <a href="mailto:utni01@utni.co.kr">utni01@utni.co.kr</a>
        </div>
    </div>
</body>
</html>
